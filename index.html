<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3G Store | Impresión 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1a1a1a;
            --black: #111111;
            --white: #ffffff;
            --accent: #6C5CE7;
            --accent-hover: #5A4BCE;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); }

        header {
            background-color: var(--white);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 24px; cursor: pointer; }
        .logo-img { height: 45px; width: auto; object-fit: contain; }

        .search-bar { flex-grow: 1; max-width: 350px; margin: 0 20px; }
        .search-bar input {
            width: 100%; padding: 10px 20px; border: 2px solid #eee; border-radius: 30px; outline: none; font-size: 14px;
        }
        .search-bar input:focus { border-color: var(--accent); }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            padding: 10px 18px; border: none; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 13px;
            transition: transform 0.2s, background 0.3s; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-primary { background-color: var(--black); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-accent { background-color: var(--accent); color: var(--white); }
        .btn-accent:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger); color: white; padding: 5px 10px; font-size: 12px; }

        .admin-controls { display: none; margin-bottom: 25px; gap: 10px; flex-wrap: wrap; }
        .is-admin .admin-controls { display: flex; }

        main { padding: 30px 5%; max-width: 1200px; margin: 0 auto; }

        /* VISTAS (Páginas internas) */
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* CATEGORÍAS */
        .categories { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 5px; }
        .cat-chip {
            padding: 8px 16px; background: var(--white); border: 2px solid var(--black); border-radius: 20px;
            cursor: pointer; font-weight: 700; white-space: nowrap; transition: all 0.3s; font-size: 14px;
        }
        .cat-chip.active { background: var(--black); color: var(--white); }

        /* GRILLA MINIMALISTA (Dashboard Principal) */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }

        .product-card {
            background: var(--white); border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); transition: transform 0.3s; cursor: pointer;
            display: flex; flex-direction: column;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }

        .product-img-container { width: 100%; height: 260px; background-color: #eee; overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .product-card:hover .product-img { transform: scale(1.03); }

        .product-preview-info { padding: 15px 20px; display: flex; flex-direction: column; gap: 5px; }
        .product-preview-cat { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .product-preview-title { font-size: 16px; font-weight: 900; color: var(--text-color); }

        /* VISTA DE DETALLE DE PRODUCTO */
        .back-nav { margin-bottom: 20px; }
        .detail-container {
            background: var(--white); border-radius: 25px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;
        }
        @media(max-width: 768px) { .detail-container { grid-template-columns: 1fr; gap: 20px; } }

        .detail-img-box { width: 100%; border-radius: 15px; overflow: hidden; background: #eee; cursor: zoom-in; }
        .detail-img { width: 100%; height: 400px; object-fit: cover; display: block; }
        
        .detail-info { display: flex; flex-direction: column; gap: 15px; }
        .detail-category { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .detail-title { font-size: 28px; font-weight: 900; }
        .detail-price { font-size: 24px; font-weight: 900; color: var(--black); }
        .detail-desc { font-size: 15px; color: #555; line-height: 1.6; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; }

        .admin-detail-actions { display: none; gap: 10px; margin-top: 10px; }
        .is-admin .admin-detail-actions { display: flex; }

        /* MODALES GENERALES */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--white); padding: 30px; border-radius: 20px; width: 100%; max-width: 450px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { margin-bottom: 20px; font-weight: 900; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 13px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; font-size: 14px;
        }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        /* MODAL PARA AMPLIAR IMAGEN */
        .image-modal-content {
            background: transparent; box-shadow: none; max-width: 800px; padding: 0; text-align: center; position: relative;
        }
        .image-modal-content img {
            width: 100%; max-height: 80vh; object-fit: contain; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-img-modal {
            position: absolute; top: -40px; right: 0; background: white; border: none; font-size: 18px; font-weight: 900;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body id="bodyContainer">

    <header>
        <div class="logo-container" onclick="goHome()">
            <img src="image_bb1905.jpg" alt="3G Logo" class="logo-img" onerror="this.style.display='none'">
            <span>3G Store</span>
        </div>
        <div class="search-bar" id="searchBarContainer">
            <input type="text" id="searchInput" placeholder="Busca tus diseños 3D..." onkeyup="renderProducts()">
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" id="loginBtn" onclick="toggleLogin()">Staff</button>
        </div>
    </header>

    <main>
        <!-- CONTROLES DE ADMINISTRADOR -->
        <div class="admin-controls">
            <button class="btn btn-accent" onclick="openProductModal()">+ Nuevo Producto</button>
            <button class="btn btn-primary" onclick="openCategoryModal()">+ Nueva Categoría</button>
            <button class="btn btn-danger" onclick="deleteCategoryModal()">- Eliminar Categoría</button>
        </div>

        <!-- VISTA 1: DASHBOARD PRINCIPAL (FEED) -->
        <section id="homeView" class="view-section active">
            <div class="categories" id="categoriesContainer"></div>
            <div class="products-grid" id="productsGrid"></div>
        </section>

        <!-- VISTA 2: DETALLE DE PRODUCTO -->
        <section id="detailView" class="view-section">
            <div class="back-nav">
                <button class="btn btn-primary" onclick="goHome()">← Volver al Catálogo</button>
            </div>
            <div class="detail-container" id="detailContainerContent">
                <!-- Se llena dinámicamente -->
            </div>
        </section>
    </main>

    <!-- MODAL DE LOGIN -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>Acceso Staff</h2>
            <div class="form-group">
                <label>Código de Acceso:</label>
                <input type="password" id="passcodeInput" placeholder="Clave...">
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal('loginModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="checkPasscode()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PARA VER IMAGEN GRANDE -->
    <div class="modal" id="imageModal" onclick="closeImageModal()">
        <div class="modal-content image-modal-content" onclick="event.stopPropagation()">
            <button class="close-img-modal" onclick="closeImageModal()">✕</button>
            <img id="modalFullImg" src="" alt="Imagen ampliada">
        </div>
    </div>

    <!-- MODAL DE PRODUCTOS (Crear / Editar) -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">Producto</h2>
            <input type="hidden" id="prodId">
            <div class="form-group">
                <label>Título:</label>
                <input type="text" id="prodTitle">
            </div>
            <div class="form-group">
                <label>Precio (Ej. Q30.00):</label>
                <input type="text" id="prodPrice">
            </div>
            <div class="form-group">
                <label>Categoría:</label>
                <select id="prodCategory"></select>
            </div>
            <div class="form-group">
                <label>Descripción:</label>
                <textarea id="prodDesc" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Nombre de la foto en la carpeta:</label>
                <input type="text" id="prodImage" placeholder="17876.jpg">
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal('productModal')">Cancelar</button>
                <button class="btn btn-accent" onclick="saveProduct()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CATEGORÍAS -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h2>Nueva Categoría</h2>
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="newCatName">
            </div>
            <div class="modal-buttons">
                <button class="btn" onclick="closeModal('categoryModal')">Cancelar</button>
                <button class="btn btn-accent" onclick="saveCategory()">Agregar</button>
            </div>
        </div>
    </div>

    <script>
        const ACCESS_CODE = "3Gadmin";
        let isAdmin = false;
        let currentFilter = "Todos";

        // BASE DE DATOS INICIAL
        let categories = ["Novedades", "Encendedores"];
        let products = [
            { 
                id: 1, 
                title: "Funda para Encendedor Bloques", 
                price: "Q30.00", 
                category: "Encendedores", 
                description: "Diseño estilo bloque de construcción. Tamaño ideal para encendedor BIC estándar.", 
                image: "17876.jpg" 
            }
        ];

        function init() {
            renderCategories();
            renderProducts();
        }

        function toggleLogin() {
            if(isAdmin) {
                isAdmin = false;
                document.getElementById('loginBtn').innerText = "Staff";
                document.getElementById('bodyContainer').classList.remove('is-admin');
            } else {
                document.getElementById('loginModal').classList.add('active');
            }
        }

        function checkPasscode() {
            if (document.getElementById('passcodeInput').value === ACCESS_CODE) {
                isAdmin = true;
                document.getElementById('loginBtn').innerText = "Salir";
                document.getElementById('bodyContainer').classList.add('is-admin');
                closeModal('loginModal');
                document.getElementById('passcodeInput').value = '';
                renderProducts();
            } else {
                alert("Clave incorrecta");
            }
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // NAVEGACIÓN ENTRE VISTAS
        function goHome() {
            document.getElementById('homeView').classList.add('active');
            document.getElementById('detailView').classList.remove('active');
            document.getElementById('searchBarContainer').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showProductDetail(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;

            const container = document.getElementById('detailContainerContent');
            container.innerHTML = `
                <div class="detail-img-box" onclick="openImageModal('${prod.image}')">
                    <img src="${prod.image}" class="detail-img" alt="${prod.title}" onerror="this.src='https://via.placeholder.com/400x400?text=3G+Store'">
                </div>
                <div class="detail-info">
                    <div class="detail-category">${prod.category}</div>
                    <h1 class="detail-title">${prod.title}</h1>
                    <div class="detail-price">${prod.price}</div>
                    <div class="detail-desc">${prod.description}</div>
                    <div class="admin-detail-actions">
                        <button class="btn btn-accent" onclick="editProduct(${prod.id})">Editar</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${prod.id})">Eliminar</button>
                    </div>
                </div>
            `;

            document.getElementById('homeView').classList.remove('active');
            document.getElementById('detailView').classList.add('active');
            document.getElementById('searchBarContainer').style.display = 'none';
            window.scrollTo(0, 0);
        }

        // AMPLIAR IMAGEN
        function openImageModal(imgSrc) {
            document.getElementById('modalFullImg').src = imgSrc;
            document.getElementById('imageModal').classList.add('active');
        }
        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            const select = document.getElementById('prodCategory');
            
            let html = `<div class="cat-chip ${currentFilter === 'Todos' ? 'active' : ''}" onclick="filterCategory('Todos')">Todos</div>`;
            categories.forEach(cat => {
                html += `<div class="cat-chip ${currentFilter === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</div>`;
            });
            container.innerHTML = html;

            select.innerHTML = '';
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            let filtered = products;
            if (currentFilter !== 'Todos') filtered = filtered.filter(p => p.category === currentFilter);
            if (searchQuery) filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery) || p.description.toLowerCase().includes(searchQuery));

            if(filtered.length === 0) {
                grid.innerHTML = '<p>No hay productos disponibles.</p>';
                return;
            }

            // DASHBOARD PRINCIPAL MINIMALISTA (Solo foto, categoría y título)
            filtered.forEach(prod => {
                grid.innerHTML += `
                    <div class="product-card" onclick="showProductDetail(${prod.id})">
                        <div class="product-img-container">
                            <img src="${prod.image}" class="product-img" alt="${prod.title}" onerror="this.src='https://via.placeholder.com/300x260?text=3G+Store'">
                        </div>
                        <div class="product-preview-info">
                            <div class="product-preview-cat">${prod.category}</div>
                            <div class="product-preview-title">${prod.title}</div>
                        </div>
                    </div>
                `;
            });
        }

        function openCategoryModal() { document.getElementById('categoryModal').classList.add('active'); }
        function saveCategory() {
            const name = document.getElementById('newCatName').value.trim();
            if(name && !categories.includes(name)) {
                categories.push(name);
                renderCategories();
                closeModal('categoryModal');
            }
        }
        function deleteCategoryModal() {
            const cat = prompt("Categoría a eliminar:");
            if(cat) {
                categories = categories.filter(c => c !== cat);
                renderCategories();
            }
        }

        function openProductModal(id = null) {
            document.getElementById('productModal').classList.add('active');
            if(id !== null) {
                const p = products.find(prod => prod.id === id);
                document.getElementById('modalTitle').innerText = "Editar Producto";
                document.getElementById('prodId').value = p.id;
                document.getElementById('prodTitle').value = p.title;
                document.getElementById('prodPrice').value = p.price;
                document.getElementById('prodCategory').value = p.category;
                document.getElementById('prodDesc').value = p.description;
                document.getElementById('prodImage').value = p.image;
            } else {
                document.getElementById('modalTitle').innerText = "Nuevo Producto";
                document.getElementById('prodId').value = "";
                document.getElementById('prodTitle').value = "";
                document.getElementById('prodPrice').value = "";
                document.getElementById('prodDesc').value = "";
                document.getElementById('prodImage').value = "";
            }
        }

        function saveProduct() {
            const id = document.getElementById('prodId').value;
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;
            const category = document.getElementById('prodCategory').value;
            const description = document.getElementById('prodDesc').value;
            const image = document.getElementById('prodImage').value || 'https://via.placeholder.com/300x250?text=3G+Store';

            if(!title || !price) {
                alert("Faltan datos obligatorios.");
                return;
            }

            if(id) {
                const index = products.findIndex(p => p.id == id);
                products[index] = { id: parseInt(id), title, price, category, description, image };
            } else {
                const newId = Date.now();
                products.push({ id: newId, title, price, category, description, image });
            }
            renderProducts();
            closeModal('productModal');
            goHome();
        }

        function editProduct(id) { openProductModal(id); }
        function deleteProduct(id) {
            if(confirm("¿Eliminar producto?")) {
                products = products.filter(p => p.id !== id);
                goHome();
                renderProducts();
            }
        }

        init();
    </script>
</body>
</html>
